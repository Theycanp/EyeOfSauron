name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CI tools and package
        run: |
          python -m pip install --requirement requirements/ci.txt
          python -m pip install --no-deps --editable .
      - name: Ruff critical-error gate
        run: ruff check src tests scripts
      - name: Strict type-checking island
        run: mypy
      - name: Static security scan
        run: bandit --recursive src/argus --exclude src/argus/admin_web --severity-level high --confidence-level high
      - name: Tests and coverage gate
        run: |
          mkdir -p artifacts
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml
      - name: Validate example configuration
        run: argus --config config/argus.example.toml check-config
      - name: Package and preflight immutable release
        env:
          RELEASE_ID: ci-${{ github.sha }}
        run: |
          release_archive="$RUNNER_TEMP/eyeofsauron-${GITHUB_SHA}.tar.gz"
          scripts/release/package-release.sh "$release_archive" "$RELEASE_ID"
          sudo env \
            EOS_INSTALL_ROOT="$RUNNER_TEMP/eos-install" \
            ARGUS_CONFIG="$GITHUB_WORKSPACE/config/argus.example.toml" \
            scripts/release/install-release.sh \
            --archive "$release_archive" \
            --release-id "$RELEASE_ID" \
            --checksum "$release_archive.sha256" \
            --prepare-only
          cp "$release_archive" "$release_archive.sha256" artifacts/
      - name: Build Python distributions
        run: python -m build --no-isolation
      - name: Install wheel in a clean environment
        run: |
          smoke_env="$RUNNER_TEMP/eos-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install dist/*.whl
          "$smoke_env/bin/argus" --help >/dev/null
          "$smoke_env/bin/argus-backup" --help >/dev/null
          echo "SMOKE_PYTHON=$smoke_env/bin/python" >>"$GITHUB_ENV"
      - name: Audit Python environment
        run: pip-audit --strict --progress-spinner=off --requirement requirements/runtime.txt
      - name: Generate Python CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-reproducible \
            --output-format JSON \
            --output-file artifacts/python-sbom.cdx.json \
            "$SMOKE_PYTHON"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-delivery-artifacts
          if-no-files-found: error
          path: |
            artifacts/
            dist/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test
      - name: Install browser for integration tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile integration tests
        working-directory: frontend
        run: npx playwright test
      - name: Build admin UI
        working-directory: frontend
        run: npm run build
      - name: Verify committed deployable bundle
        run: |
          test -s src/argus/admin_web/index.html
          find src/argus/admin_web/assets -maxdepth 1 -type f -name '*.js' -size +0c -print -quit | grep -q .
          find src/argus/admin_web/assets -maxdepth 1 -type f -name '*.css' -size +0c -print -quit | grep -q .
          git diff --exit-code -- src/argus/admin_web
          test -z "$(git ls-files --others --exclude-standard src/argus/admin_web)"
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Generate frontend CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cd frontend
          npm sbom --omit=dev --sbom-format=cyclonedx > ../artifacts/frontend-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          if-no-files-found: error
          path: artifacts/frontend-sbom.cdx.json
