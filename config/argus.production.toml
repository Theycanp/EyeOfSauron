schema_version = 2

[service]
database_path = "/var/lib/argus/state.db"
lock_path = "/var/lib/argus/service.lock"
log_level = "INFO"
source_failure_alert_after = 3
retention_days = 90
delivery_lease_seconds = 60
max_delivery_retry_seconds = 3600
managed_sources_path = "/var/lib/argus/managed-sources.json"

[ntfy]
enabled = true
base_url_env = "NTFY_BASE_URL"
token_env = "NTFY_TOKEN"
default_topic = "eos"
timeout_seconds = 15

[admin]
enabled = true
bind = "127.0.0.1"
port = 18080
auth_token_env = "ARGUS_ADMIN_TOKEN"

[[sources]]
id = "bloomberg_markets"
kind = "rss"
publisher = "Bloomberg"
section = "Markets"
dedupe_scope = "bloomberg"
url = "https://feeds.bloomberg.com/markets/news.rss"
allowed_hosts = ["feeds.bloomberg.com", "www.bloomberg.com"]
poll_interval_seconds = 120
request_timeout_seconds = 20
request_attempts = 3
retry_base_seconds = 2
max_response_bytes = 2097152

[[sources]]
id = "bloomberg_politics"
kind = "rss"
publisher = "Bloomberg"
section = "Politics"
dedupe_scope = "bloomberg"
url = "https://feeds.bloomberg.com/politics/news.rss"
allowed_hosts = ["feeds.bloomberg.com", "www.bloomberg.com"]
poll_interval_seconds = 120
request_timeout_seconds = 20
request_attempts = 3
retry_base_seconds = 2
max_response_bytes = 2097152

[[sources]]
id = "bloomberg_technology"
kind = "rss"
publisher = "Bloomberg"
section = "Technology"
dedupe_scope = "bloomberg"
url = "https://feeds.bloomberg.com/technology/news.rss"
allowed_hosts = ["feeds.bloomberg.com", "www.bloomberg.com"]
poll_interval_seconds = 120
request_timeout_seconds = 20
request_attempts = 3
retry_base_seconds = 2
max_response_bytes = 2097152

[[sources]]
id = "bloomberg_economics"
kind = "rss"
publisher = "Bloomberg"
section = "Economics"
dedupe_scope = "bloomberg"
url = "https://feeds.bloomberg.com/economics/news.rss"
