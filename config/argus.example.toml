schema_version = 2

[service]
database_path = "/tmp/argus-development.db"
lock_path = "/tmp/argus-development.lock"
log_level = "INFO"
source_failure_alert_after = 3
retention_days = 90
delivery_lease_seconds = 60
max_delivery_retry_seconds = 3600
managed_sources_path = "/tmp/argus-managed-sources.json"

[admin]
enabled = true
bind = "127.0.0.1"
port = 18080
auth_token_env = "ARGUS_ADMIN_TOKEN"

[ntfy]
enabled = false
base_url_env = "NTFY_BASE_URL"
token_env = "NTFY_TOKEN"
default_topic = "eos"
timeout_seconds = 15

# Optional semantic enrichment. Disabled by default; deterministic triage and
# existing notification rules continue to work without a model or API.
[analysis]
enabled = false
local_enabled = false
local_base_url = "http://127.0.0.1:11434/v1"
local_model = ""
api_enabled = false
shadow_mode = true
api_base_url = ""
api_model = ""
api_key_env = "ARGUS_AI_API_KEY"
prompt_id = "triage"
prompt_version = 1
timeout_seconds = 20
max_input_chars = 12000
max_response_bytes = 65536
max_tokens = 300
max_items_per_run = 50
daily_api_budget = 2
send_full_text = false
[analysis.region_weights]
CN = 5
JP = 4
US = 5
GLOBAL = 3
OTHER = 3

# Daily algorithmic digest. Keep disabled until the authenticated reader is
# reachable through your HTTPS reverse proxy; the notification links there.
[digest]
enabled = false
timezone = "Asia/Shanghai"
daily_time = "20:00"
item_limit = 30
observation_limit = 5000
notify = true
public_base_url = "https://eos.example.com"

[[sources]]
id = "bloomberg_markets"
kind = "rss"
publisher = "Bloomberg"
section = "Markets"
dedupe_scope = "bloomberg"
url = "https://feeds.bloomberg.com/markets/news.rss"
allowed_hosts = ["feeds.bloomberg.com", "www.bloomberg.com"]
poll_interval_seconds = 120
request_timeout_seconds = 20
request_attempts = 3
retry_base_seconds = 2
max_response_bytes = 2097152
region = "US"
source_tier = "secondary"
default_importance = 3

# Add custom feeds (WSJ, The Economist, official blogs, YouTube channel RSS)
# by copying this block and filling in the publisher-owned HTTPS URL. Keep
# allowed_hosts limited to the exact feed/article hosts you trust.
# [[sources]]
# id = "wsj_world"
# kind = "rss"
# publisher = "The Wall Street Journal"
# section = "World"
# dedupe_scope = "wsj"
# url = "https://<official-feed-host>/<feed>.xml"
# allowed_hosts = ["<official-feed-host>"]
# poll_interval_seconds = 300
# request_timeout_seconds = 20
# request_attempts = 3
# retry_base_seconds = 2
# max_response_bytes = 2097152

# A market source is disabled until a provider and credentials are configured.
# [[sources]]
# id = "stocks"
# kind = "market"
# publisher = "Alpaca"
# section = "Watchlist"
# dedupe_scope = "market"
# enabled = false
# poll_interval_seconds = 300
# request_timeout_seconds = 15
# request_attempts = 2
# retry_base_seconds = 2
# max_response_bytes = 524288
# [sources.settings]
# api_base_url = "https://data.alpaca.markets"
# path_template = "/v2/stocks/{symbol}/snapshot"
# api_key_env = "ALPACA_API_KEY"
# api_secret_env = "ALPACA_API_SECRET"
# symbols = ["AAPL", "MSFT"]
# price_change_threshold = 5.0
# volume_multiplier = 3.0
# gap_threshold = 3.0
# cooldown_seconds = 1800

# X, IMAP, YouTube and MQTT sources are also disabled by default. X requires
# numeric user_id; YouTube requires channel_id; IMAP uses username/password
# environment variables. Store only *_env names here, never credentials.

# Host checks are opt-in. For continuous CPU/temperature/network telemetry use
# Prometheus exporters and forward only evaluated incidents to EyeOfSauron.
# [[sources]]
# id = "host_health"
# kind = "host"
# publisher = "bk"
# section = "Host"
# dedupe_scope = "host"
# enabled = false
# poll_interval_seconds = 300
# request_timeout_seconds = 5
# request_attempts = 1
# retry_base_seconds = 1
# max_response_bytes = 65536
# [sources.settings]
# paths = ["/", "/var/lib/argus"]
# units = ["argus.service", "ntfy.service", "nginx.service"]
# disk_used_percent = 90
# inode_used_percent = 90
# memory_used_percent = 90
# load1 = 8
# allowed_listen_ports = [22, 80, 10001, 10008, 10009, 18080, 25565, 5244, 59827]
# required_listen_ports = [22, 10008, 25565]

[[rules]]
id = "bloomberg_breaking"
kind = "weighted_text"
source_ids = ["bloomberg_markets"]
threshold = 8
max_item_age_seconds = 43200
notification_title = "Bloomberg 重大新闻"
priority = 5
tags = ["rotating_light", "newspaper"]

[[rules.patterns]]
label = "明确突发标记"
regex = '(?i)\b(?:breaking|urgent)\b'
title_weight = 12
summary_weight = 12

[[rules.patterns]]
label = "紧急状态"
regex = '(?i)\b(?:state of emergency|national emergency|emergency action)\b'
title_weight = 10
summary_weight = 5
