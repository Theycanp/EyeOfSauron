name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install CI tools and package
        run: |
          python -m pip install --requirement requirements/runtime.txt --requirement requirements/ci.txt
          python -m pip install --no-deps --editable .
      - name: Backend quality, security, tests, coverage, and configuration
        run: scripts/ci/check.sh backend
      - name: Upload backend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-failure-diagnostics
          if-no-files-found: warn
          path: artifacts/backend-tests.log
      - name: Package and preflight immutable release
        env:
          RELEASE_ID: ci-${{ github.sha }}
        run: |
          release_archive="$RUNNER_TEMP/eyeofsauron-${GITHUB_SHA}.tar.gz"
          scripts/release/package-release.sh "$release_archive" "$RELEASE_ID"
          sudo env \
            ARGUS_PYTHON="$(command -v python)" \
            EOS_INSTALL_ROOT="$RUNNER_TEMP/eos-install" \
            ARGUS_CONFIG="$GITHUB_WORKSPACE/config/argus.example.toml" \
            scripts/release/install-release.sh \
            --archive "$release_archive" \
            --release-id "$RELEASE_ID" \
            --checksum "$release_archive.sha256" \
            --prepare-only
          cp "$release_archive" "$release_archive.sha256" artifacts/
      - name: Build Python distributions
        run: python -m build --no-isolation
      - name: Install wheel in a clean environment
        run: |
          smoke_env="$RUNNER_TEMP/eos-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install dist/*.whl
          "$smoke_env/bin/argus" --help >/dev/null
          "$smoke_env/bin/argus-backup" --help >/dev/null
          echo "SMOKE_PYTHON=$smoke_env/bin/python" >>"$GITHUB_ENV"
      - name: Audit Python environment
        run: pip-audit --strict --progress-spinner=off --requirement requirements/runtime.txt
      - name: Generate Python CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-reproducible \
            --output-format JSON \
            --output-file artifacts/python-sbom.cdx.json \
            "$SMOKE_PYTHON"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-delivery-artifacts
          if-no-files-found: error
          path: |
            artifacts/
            dist/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser for integration tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend lint, types, tests, and reproducible build
        run: scripts/ci/check.sh frontend
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Generate frontend CycloneDX SBOM
        run: |
          mkdir -p artifacts
          cd frontend
          npm sbom --omit=dev --sbom-format=cyclonedx > ../artifacts/frontend-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-sbom
          if-no-files-found: error
          path: artifacts/frontend-sbom.cdx.json
