name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example configuration
        run: argus --config config/argus.example.toml check-config

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build admin UI
        working-directory: frontend
        run: npm run build
      - name: Verify deployable bundle
        run: test -s src/argus/admin_web/index.html && test -s src/argus/admin_web/assets/index.js && test -s src/argus/admin_web/assets/index.css
