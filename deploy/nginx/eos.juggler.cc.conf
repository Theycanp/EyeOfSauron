server {
    listen 10008 ssl;
    listen [::]:10008 ssl;
    server_name eos.juggler.cc;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/eos.juggler.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eos.juggler.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EOSSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 256k;
    limit_req_status 429;

    location = /api/auth/login {
        limit_req zone=eos_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=eos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
